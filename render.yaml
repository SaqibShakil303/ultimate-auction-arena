# Render Blueprint: one web service that runs the game server (HTTP + WebSocket) AND serves the
# web client. This is a complete deployment on its own — one URL, nothing else to configure.
#
# Hosting the client on Netlify or Vercel instead? Add two environment variables to this service
# in the Render dashboard afterwards (see docs/DEPLOYMENT.md):
#   ALLOWED_ORIGINS = https://your-site.netlify.app      SERVE_CLIENT = off

services:
  - type: web
    name: ultimate-auction-arena
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The free plan has no persistent disk, so room files would not survive a restart anyway.
      - key: PERSIST
        value: "off"
