# Netlify hosts the WEB CLIENT only. Online multiplayer also needs the game server
# (see docs/DEPLOYMENT.md) and its address in the VITE_WS_URL environment variable.

[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every unknown path (including invite links) loads the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
